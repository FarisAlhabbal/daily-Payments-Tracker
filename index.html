<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Payments Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Daily Payments Tracker</h1>
      <p class="subtitle">Track what you paid and what you borrowed.</p>
    </header>

    <section class="summary" aria-label="Summary">
      <div class="card">
        <span class="card-label">Total paid</span>
        <span class="card-value" id="total-paid">0</span>
      </div>
      <div class="card">
        <span class="card-label">Total borrowed</span>
        <span class="card-value" id="total-borrowed">0</span>
      </div>
      <div class="card">
        <span class="card-label">Entries</span>
        <span class="card-value" id="total-entries">0</span>
      </div>
    </section>

    <form id="payment-form" class="add-row">
      <input type="text" id="name" placeholder="Name" required>
      <input type="number" id="amount" placeholder="Amount" min="0" step="0.01" required>
      <input type="date" id="date" required>
      <select id="tag">
        <option value="food">Food</option>
        <option value="bills">Bills</option>
        <option value="transport">Transport</option>
        <option value="shopping">Shopping</option>
        <option value="other">Other</option>
      </select>
      <select id="type">
        <option value="paid">Paid</option>
        <option value="borrowed">Borrowed</option>
      </select>
      <button type="submit">+ Add</button>
    </form>

    <div class="table-wrap">
      <table id="payments-table">
        <thead>
          <tr>
            <th>Name</th>
            <th class="num">Amount</th>
            <th>Date</th>
            <th>Tag</th>
            <th>Type</th>
            <th class="actions-col"></th>
          </tr>
        </thead>
        <tbody id="payments-body">
          <tr>
            <td>Groceries</td>
            <td class="num">45.50</td>
            <td>2026-10-11</td>
            <td><span class="tag tag-food">Food</span></td>
            <td><span class="badge badge-paid">Paid</span></td>
            <td class="actions-col"><button class="delete-btn" aria-label="Delete row">&times;</button></td>
          </tr>
          <tr>
            <td>Electricity bill</td>
            <td class="num">80.00</td>
            <td>2026-10-10</td>
            <td><span class="tag tag-bills">Bills</span></td>
            <td><span class="badge badge-paid">Paid</span></td>
            <td class="actions-col"><button class="delete-btn" aria-label="Delete row">&times;</button></td>
          </tr>
          <tr>
            <td>Borrowed from Ali</td>
            <td class="num">120.00</td>
            <td>2026-10-09</td>
            <td><span class="tag tag-other">Other</span></td>
            <td><span class="badge badge-borrowed">Borrowed</span></td>
            <td class="actions-col"><button class="delete-btn" aria-label="Delete row">&times;</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
